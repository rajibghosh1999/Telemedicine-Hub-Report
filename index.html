<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telemedicine Hub Performance - North 24 Parganas</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- html2canvas for JPG Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container-fluid py-3 py-md-4 print-container">

    <!-- Government & Hub Header -->
    <div class="government-header text-center mb-4" id="governmentHeader">
        <h3 class="fw-bold text-success mt-2">
            <i class="fa-solid fa-hospital-user me-2"></i> Telemedicine Hub Performance
        </h3>
        <h5 class="fw-bold text-dark">Hub North 24 Parganas</h5>
        <p class="text-muted mb-0">
            <i class="fa-solid fa-calendar-days me-1"></i> Report Date : <span id="reportDate" class="fw-bold text-dark"></span>
        </p>
    </div>

    <!-- Upload & Section Selection Controls (No Print) -->
<div class="card shadow mb-4 no-print border-dark">
    <div class="card-body">
        <div class="row g-2 align-items-end"> <!-- g-2 ব্যবহার করেছি যাতে গ্যাপ কম থাকে -->
            <div class="col-12 col-lg-4">
                <label class="form-label fw-bold text-dark small mb-1">Upload File:</label>
                <input type="file" id="excelFile" class="form-control form-control-sm border-secondary" accept=".xlsx,.xls,.csv">
            </div>
            <div class="col-12 col-lg-3">
                <label class="form-label fw-bold text-dark small mb-1">Section:</label>
                <select id="sectionSelect" class="form-select form-select-sm border-secondary fw-bold">
                    <option value="1">Block Wise</option>
                    <option value="2">Hospital Wise</option>
                </select>
            </div>
            <div class="col-12 col-lg-2">
                 <label class="form-label fw-bold text-dark small mb-1">Date:</label>
                <input type="date" id="reportDateInput" class="form-control form-control-sm border-secondary">
            </div>
            <div class="col-12 col-lg-3 d-grid">
                <button id="generateReport" class="btn btn-primary btn-sm fw-bold">
                    <i class="fa-solid fa-chart-line me-1"></i> Generate Report
                </button>
            </div>
        </div>
        
        <!-- নতুন স্ট্যাটস দেখানোর জন্য জায়গা -->
        <div id="hubSummaryStats" class="mt-3"></div>

        <div id="loading" class="text-center mt-2 d-none">
            <div class="spinner-border spinner-border-sm text-success"></div>
            <span class="ms-2 fw-bold text-success small">Processing...</span>
        </div>
    </div>
</div>


    <!-- বাটনের অংশ -->
    <div class="card-body bg-light border-bottom border-dark text-center no-print d-flex flex-wrap justify-content-center gap-2 py-2">
        <button id="btnExportExcel" class="btn btn-success btn-sm fw-bold"><i class="fa-solid fa-file-excel me-1"></i> Download Excel</button>
        <button id="btnExportPDF" class="btn btn-danger btn-sm fw-bold"><i class="fa-solid fa-file-pdf me-1"></i> Save as PDF</button>
        <button id="btnExportJPG" class="btn btn-warning btn-sm fw-bold text-dark"><i class="fa-solid fa-image me-1"></i> Download JPG</button>
        <button id="btnShareWhatsApp" class="btn btn-whatsapp btn-sm fw-bold text-white"><i class="fa-brands fa-whatsapp me-1"></i> Share via WhatsApp</button>
    </div>

    <!-- MAIN HUB REPORT CARD -->
    <div class="card shadow mb-4 border-dark" id="hubReportCard">
        <div class="card-header header-hub text-white fw-bold h5 mb-0 text-center py-3">
            <div id="reportTitleHeader">Block Wise Doctor Tele-Consultation Report</div>
        </div>
        <div class="table-responsive">
            <table class="table table-bordered border-dark align-middle mb-0 custom-black-table">
                <thead class="subhead-dark-blue text-center">
                    <tr>
                        <!-- কলামের সাইজ আপডেট করা হয়েছে -->
                        <th style="width: 5%;">Sl No.</th>
                        <th id="colHeaderName" style="width: 20%;">Name of the Block</th>
                        <th style="width: 30%;">Doctor Name</th>
                        <th style="width: 20%;">Total Completed Consultation</th>
                        <th style="width: 15%;">In Process</th>
                    </tr>
                </thead>
                <tbody id="hubReportBody">
                    <tr>
                        <td colspan="5" class="text-center py-4 text-muted fw-bold">
                            ফাইল আপলোড করে "Generate Hub Report" বাটনে ক্লিক করুন।
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- ADD DOCTOR SECTION -->
<div class="card border-success shadow-sm mt-3 no-print" id="addDoctorCard">
    <div class="card-header bg-success text-white fw-bold">
        <i class="fa-solid fa-user-plus me-2"></i>
        Add New Doctor to Master Sheet
    </div>

    <div class="card-body">
        <div class="row g-3 align-items-end">

            <div class="col-12 col-md-3">
                <label class="form-label fw-bold">HF Type</label>
                <select id="addHFType" class="form-select">
                    <option value="">Select HF Type</option>
                    <option value="Block">Block</option>
                    <option value="Hospital">Hospital</option>
                </select>
            </div>

            <div class="col-12 col-md-4">
                <label class="form-label fw-bold">
                    Block / Hospital Name
                </label>
                <select id="addLocationName" class="form-select">
                    <option value="">Select Block / Hospital</option>
                </select>
            </div>

            <div class="col-12 col-md-3">
                <label class="form-label fw-bold">
                    Enter Doctor Name
                </label>
                <input type="text"
                       id="addDoctorName"
                       class="form-control"
                       placeholder="Enter Doctor Name">
            </div>

            <div class="col-12 col-md-2 d-grid">
                <button type="button"
                        id="btnAddDoctor"
                        class="btn btn-success fw-bold">
                    <i class="fa-solid fa-plus me-1"></i>
                    Add Doctor
                </button>
            </div>

        </div>

        <div id="addDoctorMessage" class="mt-3"></div>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
